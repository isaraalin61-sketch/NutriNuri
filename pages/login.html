<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="../bootstrap-5.3.8-dist/css/bootstrap.min.css"
    >

    <link
        rel="stylesheet"
        href="../styles/style.css"
    >

    <title>Login - NutriNuri</title>

    <link
        rel="icon"
        type="image/svg+xml"
        href="../images/fontawesom/otter-solid-full.svg"
    >

</head>

<body class="d-flex justify-content-center min-vh-100">

    <div class="login-container col-11 col-sm-8 col-md-5 col-lg-4 col-xl-3">

        <div class="text-center mb-4">

            <div
                class="rounded-circle bg-white d-inline-flex p-3 shadow-sm border border-4"
                style="border-color: #EBD7C5 !important;"
            >

                <img
                    src="../../images/fontawesom/otter-solid-full.svg"
                    alt="Logo"
                    width="50"
                    height="50"
                >

            </div>

            <h2 class="mt-3 fw-bold text-nuri-dark">
                ¡Bienvenido!
            </h2>

        </div>

        <div class="auth-card">

            <div class="text-center mb-4">

                <h2 class="auth-title">
                    Iniciar Sesión
                </h2>

            </div>

            <form id="loginForm">

                <div class="mb-3">

                    <label class="form-label small fw-bold text-nuri-dark">
                        USUARIO
                    </label>

                    <input
                        id="correo"
                        type="email"
                        class="form-control"
                        placeholder="tu@email.com"
                    >

                    <span class="error" id="errorCorreo"></span>

                </div>

                <div class="mb-4">

                    <label class="form-label small fw-bold text-nuri-dark">
                        CONTRASEÑA
                    </label>

                    <div class="input-group">

                        <input
                            id="contrasena"
                            type="password"
                            class="form-control"
                            placeholder="*********"
                        >

                        <button
                            class="btn btn-outline-secondary"
                            type="button"
                            id="togglePassword"
                        >

                            <svg
                                id="eyeIconSVG"
                                width="20"
                                height="20"
                                viewBox="0 0 640 640"
                                style="fill: #744c38;"
                            >

                                <path></path>

                            </svg>

                        </button>

                    </div>

                    <div class="text-end mt-1">

                        <a
                            href="./recuperar_password.html"
                            class="text-decoration-none forgot-link"
                        >

                            ¿Olvidaste tu contraseña?

                        </a>

                    </div>

                    <span
                        class="error"
                        id="errorContrasena"
                    ></span>

                </div>

                <button
                    class="btn-auth w-100 shadow-sm"
                    type="submit"
                >

                    INGRESAR

                </button>

            </form>

        </div>

        <div class="text-center mt-4">

            <p class="small text-nuri-dark">

                ¿No tienes cuenta?

                <a
                    href="./registro.html"
                    class="fw-bold text-decoration-none register-link"
                >

                    Regístrate aquí

                </a>

            </p>

        </div>

    </div>

    <script src="../bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>

    <script
        type="module"
        src="../controllers/login-controller.js"
    ></script>

</body>
</html>
